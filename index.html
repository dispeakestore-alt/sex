<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>ALEXANDROVA_CHAT App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
        :root {
            --bg-color: #0d0f17;
            --card-bg: rgba(255, 255, 255, 0.05);
            --primary-accent: #8a2be2;
            --secondary-accent: #00f2fe;
            --text-color: #ffffff;
            --text-dim: #a0a5ba;
        }

        body {
            margin: 0;
            padding: 16px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
            overflow-x: hidden;
        }

        h2 {
            font-size: 20px;
            margin-bottom: 20px;
            text-shadow: 0 0 10px rgba(138, 43, 226, 0.5);
        }

        .card-perspective {
            perspective: 1000px;
            width: 100%;
            max-width: 340px;
            margin-bottom: 24px;
        }

        .alexandrova-card {
            background: linear-gradient(135deg, rgba(138, 43, 226, 0.2), rgba(0, 242, 254, 0.15));
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            padding: 24px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5), 0 0 20px rgba(138, 43, 226, 0.3);
            transform-style: preserve-3d;
            transition: transform 0.1s ease-out;
            position: relative;
            overflow: hidden;
        }

        .card-badge {
            display: inline-block;
            background: linear-gradient(90deg, #8a2be2, #00f2fe);
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: bold;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 12px;
        }

        .card-title {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: 1.5px;
            background: linear-gradient(90deg, #ffffff, #00f2fe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 8px 0;
        }

        .voucher-box {
            display: none;
            margin-top: 16px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px dashed var(--secondary-accent);
            border-radius: 12px;
            padding: 12px;
        }

        .voucher-code {
            font-family: 'Courier New', monospace;
            font-size: 18px;
            font-weight: bold;
            color: #00f2fe;
            letter-spacing: 2px;
            margin-bottom: 8px;
            word-break: break-all;
        }

        .copy-btn {
            background: #00f2fe;
            color: #000;
            border: none;
            padding: 6px 14px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 12px;
        }

        .tasks-container {
            width: 100%;
            max-width: 340px;
        }

        .task-card {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 14px;
        }

        .task-title {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .task-desc {
            font-size: 12px;
            color: var(--text-dim);
            margin-bottom: 12px;
        }

        .input-group {
            display: flex;
            gap: 8px;
        }

        .code-input {
            flex: 1;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            padding: 10px 12px;
            color: #fff;
            font-size: 13px;
            outline: none;
        }

        .submit-btn {
            background: linear-gradient(135deg, var(--primary-accent), #6a11cb);
            color: white;
            border: none;
            border-radius: 10px;
            padding: 10px 16px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
        }

        .completed-badge {
            color: #00e676;
            font-size: 13px;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <h2>Ежедневные задания</h2>

    <div class="card-perspective">
        <div class="alexandrova-card" id="mainCard">
            <div class="card-badge">Ежедневный приз</div>
            <div class="card-title">ALEXANDROVA_CHAT</div>
            <div id="cardStatus" style="font-size: 13px; color: var(--text-dim); margin-top: 6px;">
                Выполните задание ниже, чтобы получить ваш ваучер
            </div>

            <div class="voucher-box" id="voucherBox">
                <div style="font-size: 11px; color: var(--text-dim); margin-bottom: 4px;">Ваш уникальный ваучер:</div>
                <div class="voucher-code" id="voucherCode">ALEX-XXXX-XXXX</div>
                <button class="copy-btn" onclick="copyVoucher()">Скопировать</button>
            </div>
        </div>
    </div>

    <div class="tasks-container" id="tasksList">
        <div style="text-align: center; color: var(--text-dim);">Загрузка заданий...</div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // ВАЖНО: Укажи IP своего VPS сервера
        const API_BASE_URL = "http://5.129.201.177"; 

        const card = document.getElementById('mainCard');
        document.addEventListener('mousemove', (e) => {
            const xAxis = (window.innerWidth / 2 - e.pageX) / 15;
            const yAxis = (window.innerHeight / 2 - e.pageY) / 15;
            card.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
        });

        async function loadTasks() {
            try {
                const res = await fetch(`${API_BASE_URL}/api/tasks`, {
                    headers: { 'X-Init-Data': tg.initData }
                });
                const data = await res.json();
                
                if (data.status === 'ok') {
                    renderTasks(data.tasks);
                } else {
                    document.getElementById('tasksList').innerHTML = `<div style="color: #ff5252; text-align: center;">${data.message || 'Ошибка'}</div>`;
                }
            } catch (err) {
                document.getElementById('tasksList').innerHTML = `<div style="color: #ff5252; text-align: center;">Ошибка соединения с API</div>`;
            }
        }

        function renderTasks(tasks) {
            const container = document.getElementById('tasksList');
            if (!tasks || tasks.length === 0) {
                container.innerHTML = '<div style="text-align: center; color: var(--text-dim);">Заданий пока нет</div>';
                return;
            }

            container.innerHTML = tasks.map(task => `
                <div class="task-card">
                    <div class="task-title">${task.title}</div>
                    <div class="task-desc">${task.description || ''}</div>
                    ${task.completed ? `
                        <div class="completed-badge">✓ Задание выполнено</div>
                    ` : `
                        <div class="input-group">
                            <input type="text" class="code-input" id="input-${task.id}" placeholder="Введите код">
                            <button class="submit-btn" onclick="submitTask(${task.id})">Получить</button>
                        </div>
                    `}
                </div>
            `).join('');
        }

        async function submitTask(taskId) {
            const inputEl = document.getElementById(`input-${taskId}`);
            const code = inputEl ? inputEl.value.trim() : '';

            if (!code) {
                tg.showAlert('Введите код!');
                return;
            }

            try {
                const res = await fetch(`${API_BASE_URL}/api/complete-task`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        init_data: tg.initData,
                        task_id: taskId,
                        code: code
                    })
                });

                const data = await res.json();

                if (data.status === 'ok') {
                    confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
                    document.getElementById('cardStatus').innerText = '🎉 Поздравляем с выполнением задания!';
                    document.getElementById('voucherCode').innerText = data.voucher;
                    document.getElementById('voucherBox').style.display = 'block';
                    tg.HapticFeedback.notificationOccurred('success');
                    loadTasks();
                } else {
                    tg.showAlert(data.message || 'Неверный код!');
                    tg.HapticFeedback.notificationOccurred('error');
                }
            } catch (e) {
                tg.showAlert('Ошибка отправки запроса');
            }
        }

        function copyVoucher() {
            const code = document.getElementById('voucherCode').innerText;
            navigator.clipboard.writeText(code).then(() => {
                tg.showAlert('Ваучер скопирован!');
            });
        }

        loadTasks();
    </script>
</body>
</html>
