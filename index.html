<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Обучение</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --bg2: var(--tg-theme-secondary-bg-color, #f4f4f5);
    --text: var(--tg-theme-text-color, #111);
    --hint: var(--tg-theme-hint-color, #888);
    --link: var(--tg-theme-link-color, #2481cc);
    --btn: var(--tg-theme-button-color, #2481cc);
    --btnText: var(--tg-theme-button-text-color, #fff);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding-bottom: 40px;
    transition: background 0.2s;
  }
  .header {
    padding: 24px 20px 16px;
    background: linear-gradient(135deg, var(--btn), #4a9eff);
    color: #fff;
    border-radius: 0 0 24px 24px;
    margin-bottom: 16px;
  }
  .header h1 { margin: 0 0 4px; font-size: 22px; font-weight: 700; }
  .header p { margin: 0; opacity: 0.9; font-size: 14px; }
  .search {
    margin: 0 16px 16px;
    position: relative;
  }
  .search input {
    width: 100%;
    padding: 12px 16px 12px 42px;
    border-radius: 12px;
    border: none;
    background: var(--bg2);
    color: var(--text);
    font-size: 15px;
    outline: none;
  }
  .search::before {
    content: '🔍';
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 15px;
  }
  .projects-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    padding: 0 16px;
  }
  .project-card {
    background: var(--bg2);
    padding: 16px;
    border-radius: 16px;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
    position: relative;
    overflow: hidden;
  }
  .project-card:active { transform: scale(0.97); }
  .project-card .icon { font-size: 32px; margin-bottom: 8px; }
  .project-card .name { font-weight: 600; font-size: 15px; margin-bottom: 4px; }
  .project-card .desc {
    font-size: 12px;
    color: var(--hint);
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .project-card .count {
    position: absolute;
    top: 12px;
    right: 12px;
    background: var(--btn);
    color: var(--btnText);
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 10px;
    font-weight: 600;
  }
  .view { display: none; padding: 0 16px; }
  .view.active { display: block; }
  .back-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 14px;
    background: var(--bg2);
    border: none;
    border-radius: 12px;
    color: var(--text);
    font-size: 14px;
    margin: 0 16px 16px;
    cursor: pointer;
    font-weight: 500;
  }
  .back-btn:active { opacity: 0.7; }
  .question {
    background: var(--bg2);
    border-radius: 14px;
    margin-bottom: 10px;
    overflow: hidden;
  }
  .q-head {
    padding: 14px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    cursor: pointer;
    font-weight: 500;
    font-size: 15px;
    gap: 12px;
  }
  .q-head .arrow {
    transition: transform 0.2s;
    color: var(--hint);
    flex-shrink: 0;
  }
  .question.open .q-head .arrow { transform: rotate(180deg); }
  .q-body {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.3s ease;
    padding: 0 16px;
    color: var(--text);
    font-size: 14px;
    line-height: 1.55;
    white-space: pre-wrap;
    border-top: 1px solid rgba(128,128,128,0.15);
  }
  .question.open .q-body { max-height: 3000px; padding: 14px 16px; }
  .empty {
    text-align: center;
    padding: 60px 20px;
    color: var(--hint);
  }
  .empty .e { font-size: 48px; margin-bottom: 12px; }
  .loader {
    text-align: center;
    padding: 60px;
    color: var(--hint);
  }
  .highlight { background: rgba(255,220,0,0.35); border-radius: 3px; padding: 0 2px; }
</style>
</head>
<body>
  <div class="header">
    <h1 id="title">📚 Обучение</h1>
    <p id="subtitle">Ответы на все вопросы по проектам</p>
  </div>

  <!-- Главный экран -->
  <div id="viewHome" class="view active">
    <div class="search"><input id="search" placeholder="Поиск по проектам..." /></div>
    <div id="projects" class="projects-grid"></div>
    <div id="searchResults"></div>
  </div>

  <!-- Экран проекта -->
  <div id="viewProject" class="view">
    <button class="back-btn" onclick="goHome()">← Назад</button>
    <div style="padding: 0 16px 16px;">
      <h2 id="projTitle" style="margin: 0 0 6px; font-size: 20px;"></h2>
      <p id="projDesc" style="margin: 0; color: var(--hint); font-size: 14px;"></p>
    </div>
    <div id="questions"></div>
  </div>

<script>
  const tg = window.Telegram?.WebApp;
  if (tg) {
    tg.ready();
    tg.expand();
    tg.setHeaderColor('secondary_bg_color');
  }

  let projects = [];

  async function init() {
    // регистрируем пользователя
    if (tg?.initDataUnsafe?.user) {
      const u = tg.initDataUnsafe.user;
      fetch('/api/users', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          telegram_id: u.id,
          username: u.username,
          first_name: u.first_name,
          last_name: u.last_name
        })
      }).catch(() => {});
    }

    try {
      const r = await fetch('/api/projects');
      projects = await r.json();
      renderProjects(projects);
    } catch (e) {
      document.getElementById('projects').innerHTML =
        '<div class="empty"><div class="e">⚠️</div>Ошибка загрузки</div>';
    }
  }

  function renderProjects(list) {
    const el = document.getElementById('projects');
    if (!list.length) {
      el.innerHTML = '<div class="empty" style="grid-column:1/-1"><div class="e">📭</div>Проектов пока нет</div>';
      return;
    }
    el.innerHTML = list.map(p => `
      <div class="project-card" onclick="openProject(${p.id})">
        <div class="count">${p.questions_count || ''}</div>
        <div class="icon">${escapeHtml(p.icon || '📁')}</div>
        <div class="name">${escapeHtml(p.name)}</div>
        <div class="desc">${escapeHtml(p.description || '')}</div>
      </div>
    `).join('');
  }

  async function openProject(id) {
    document.getElementById('viewHome').classList.remove('active');
    document.getElementById('viewProject').classList.add('active');
    document.getElementById('questions').innerHTML = '<div class="loader">Загрузка...</div>';
    window.scrollTo(0, 0);

    const r = await fetch('/api/projects/' + id);
    const data = await r.json();
    document.getElementById('projTitle').textContent = (data.icon || '📁') + ' ' + data.name;
    document.getElementById('projDesc').textContent = data.description || '';

    const qs = document.getElementById('questions');
    if (!data.questions.length) {
      qs.innerHTML = '<div class="empty"><div class="e">🤔</div>Вопросов пока нет</div>';
      return;
    }
    qs.innerHTML = data.questions.map(q => `
      <div class="question" onclick="toggleQ(this)">
        <div class="q-head">
          <span>${escapeHtml(q.title)}</span>
          <span class="arrow">▾</span>
        </div>
        <div class="q-body">${escapeHtml(q.answer)}</div>
      </div>
    `).join('');
  }

  function toggleQ(el) {
    el.classList.toggle('open');
  }

  function goHome() {
    document.getElementById('viewProject').classList.remove('active');
    document.getElementById('viewHome').classList.add('active');
    window.scrollTo(0, 0);
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }

  // Поиск
  const searchInput = document.getElementById('search');
  searchInput.addEventListener('input', async (e) => {
    const q = e.target.value.trim().toLowerCase();
    const projectsEl = document.getElementById('projects');
    const resultsEl = document.getElementById('searchResults');

    if (!q) {
      projectsEl.style.display = 'grid';
      resultsEl.innerHTML = '';
      return;
    }
    projectsEl.style.display = 'none';

    const filtered = projects.filter(p =>
      p.name.toLowerCase().includes(q) ||
      (p.description || '').toLowerCase().includes(q)
    );

    // также ищем в вопросах
    const allQs = [];
    for (const p of projects) {
      try {
        const r = await fetch('/api/projects/' + p.id);
        const d = await r.json();
        (d.questions || []).forEach(q => {
          if (q.title.toLowerCase().includes(q) || q.answer.toLowerCase().includes(q)) {
            allQs.push({ ...q, project: p });
          }
        });
      } catch {}
    }

    resultsEl.innerHTML = `
      ${filtered.length ? '<h3 style="padding:0 16px;font-size:14px;color:var(--hint)">Проекты</h3>' : ''}
      <div class="projects-grid" style="padding-bottom:16px">
        ${filtered.map(p => `
          <div class="project-card" onclick="openProject(${p.id})">
            <div class="icon">${escapeHtml(p.icon || '📁')}</div>
            <div class="name">${highlight(p.name, q)}</div>
            <div class="desc">${escapeHtml(p.description || '')}</div>
          </div>
        `).join('')}
      </div>
      ${allQs.length ? '<h3 style="padding:0 16px;font-size:14px;color:var(--hint)">Вопросы</h3>' : ''}
      <div style="padding:0 16px">
        ${allQs.map(x => `
          <div class="question" onclick="toggleQ(this)">
            <div class="q-head">
              <span>${highlight(x.title, q)} <small style="color:var(--hint)">· ${escapeHtml(x.project.name)}</small></span>
              <span class="arrow">▾</span>
            </div>
            <div class="q-body">${escapeHtml(x.answer)}</div>
          </div>
        `).join('')}
      </div>
      ${!filtered.length && !allQs.length ? '<div class="empty"><div class="e">🔎</div>Ничего не найдено</div>' : ''}
    `;
  });

  function highlight(text, q) {
    const esc = escapeHtml(text);
    const re = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
    return esc.replace(re, '<span class="highlight">$1</span>');
  }

  init();
</script>
</body>
</html>
